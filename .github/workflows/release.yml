# Builds the game for every platform it can be played on.
#
# jpackage can only build for the machine it runs on — it bundles that
# platform's Java runtime and JavaFX native libraries — so the only way to
# produce a Windows installer is to run it on Windows. That is what this is
# for: one runner per platform, each producing a package a player can open
# without installing anything.
name: Build and release

on:
  # Tag a commit and every platform is built and attached to a release:
  #   git tag v1.0.0 && git push origin v1.0.0
  push:
    tags:
      - 'v*'

  # Or run it by hand from the Actions tab to get downloadable builds
  # without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '21'

jobs:
  # The rules and the interface, before anything is built for anybody.
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Part of the suite drives real JavaFX screens — laying them out,
      # pressing their buttons, measuring what fits — and JavaFX will not
      # start without a display. A virtual one is enough.
      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run the suite
        run: xvfb-run -a ./mvnw --batch-mode test

  package:
    name: ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.os }}

    strategy:
      # One platform failing should not throw away the others' builds.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            installer: deb

          - os: windows-latest
            label: windows-x86_64
            installer: msi

          # macos-13 is the last Intel runner; macos-latest is Apple silicon.
          # The two need separate builds because the JavaFX native libraries
          # and the bundled runtime are per-architecture.
          - os: macos-13
            label: macos-x86_64
            installer: dmg

          - os: macos-latest
            label: macos-arm64
            installer: dmg

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # A tag names the version; a manual run is just 1.0.0. Windows installers
      # reject a leading zero in the major version, so there is no 0.x here.
      - name: Work out the version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=1.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the jar
        run: ./mvnw --batch-mode package -DskipTests

      - name: Stage it for packaging
        run: |
          # jpackage refuses to write into a directory that already exists, so
          # a re-run on a runner that kept its workspace would fail here rather
          # than rebuild.
          rm -rf target/app target/dist target/installer

          mkdir -p target/app
          cp target/almirath.jar target/app/

      # The portable build: a folder with a launcher and its own runtime,
      # which needs nothing installed and works on every platform here.
      - name: Build the portable app
        run: |
          jpackage \
            --type app-image \
            --name AlMirath \
            --app-version "${{ steps.version.outputs.value }}" \
            --input target/app \
            --main-jar almirath.jar \
            --main-class com.example.al_mirath.Launcher \
            --dest target/dist

      - name: Archive the portable app
        if: runner.os != 'Windows'
        run: tar -czf "target/AlMirath-${{ matrix.label }}-portable.tar.gz" -C target/dist .

      - name: Archive the portable app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/dist/* -DestinationPath "target/AlMirath-${{ matrix.label }}-portable.zip"

      # jpackage builds Windows installers with WiX, and only version 3.
      - name: Install WiX
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset --version=3.11.2 --no-progress -y
          echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" >> $env:GITHUB_PATH

      - name: Build the installer
        run: |
          extra=""

          case "${{ matrix.installer }}" in
            deb) extra="--linux-shortcut" ;;
            msi) extra="--win-menu --win-shortcut --win-dir-chooser" ;;
          esac

          jpackage \
            --type "${{ matrix.installer }}" \
            --name AlMirath \
            --app-version "${{ steps.version.outputs.value }}" \
            --input target/app \
            --main-jar almirath.jar \
            --main-class com.example.al_mirath.Launcher \
            --description "Al-Mirath: Heirs of the Golden Age" \
            --vendor "Al-Mirath" \
            --dest target/installer \
            $extra

      - name: Name the installer after its platform
        run: |
          cd target/installer

          for file in *; do
            case "$file" in
              *.deb|*.msi|*.dmg|*.exe|*.rpm|*.pkg)
                extension="${file##*.}"
                mv "$file" "AlMirath-${{ matrix.label }}.${extension}"
                ;;
            esac
          done

      # Kept even when a step above failed. If the Windows installer will not
      # build, the portable archive that built fine two steps earlier is still
      # worth having, and the job is still red so nobody misses that something
      # went wrong.
      - name: Keep the builds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AlMirath-${{ matrix.label }}
          path: |
            target/AlMirath-*-portable.*
            target/installer/AlMirath-*
          if-no-files-found: error

          # Each platform is a few hundred megabytes, most of it artwork, and
          # a run produces four of them. A tagged release keeps its own copies
          # for good; these are only for looking at a build that has no tag.
          retention-days: 14

  release:
    name: Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Collect every platform's builds
        uses: actions/download-artifact@v4
        with:
          path: builds
          merge-multiple: true

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF#refs/tags/}"

          gh release create "$version" \
            --title "Al-Mirath $version" \
            --generate-notes \
            || echo "Release already exists; uploading to it."

          gh release upload "$version" builds/* --clobber
